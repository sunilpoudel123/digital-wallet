spring:
  application:
    name: wallet-user
  datasource:
    url: jdbc:mysql://localhost:3306/authorization_server
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  main:
    allow-bean-definition-overriding: true

  security:
    oauth2:
      client:
        registration:
          github:
            clientId: ${GITHUB_CLIENT_ID}
            clientSecret: ${GITHUB_CLIENT_SECRET}
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}

logging:
  level:
    org:
      springframework:
        security: DEBUG
debug: false

server:
  port: 8090

feature:
    oauth2UserService:
      enabled: false